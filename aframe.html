<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi primera escena del sistema solar</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>
  <a-scene background="color: #071827" vr-mode-ui="enabled: false">
    <a-sphere position="-1.4 1.5 -4" radius="0.7" color="#ffcb47"
      material="shader: flat"></a-sphere>

    <a-entity position="0.9 1.5 -4"
      animation="property: rotation; to: 0 360 0;
      dur: 6000; loop: true; easing: linear">

      <a-sphere radius="0.35" color="#2788ce"
        material="shader: flat"></a-sphere>

      <a-sphere position="0 0 0.34" radius="0.06" color="#50b877"
        material="shader: flat"></a-sphere>
    </a-entity>

    <a-entity camera position="0 1.6 0" look-controls></a-entity>
  </a-scene>
</body>
</html>
